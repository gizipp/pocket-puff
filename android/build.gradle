buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.4.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')

    // Fix for plugins using deprecated jcenter()
    afterEvaluate {
        repositories.removeIf { repo ->
            if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
                def url = repo.url.toString()
                if (url.contains('jcenter')) {
                    logger.warn("Repository ${repo.url} removed (jcenter is deprecated)")
                    return true
                }
            }
            return false
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
